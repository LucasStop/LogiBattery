name: LogiBattery
options:
  bundleIdPrefix: com.lucasstop
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "165"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  QCYKit:
    url: https://github.com/LucasStop/QCYKit
    from: 0.1.0
targets:
  LogiBattery:
    type: application
    platform: macOS
    sources:
      - LogiBattery
      - LogiBatteryPowerHelper/PowerHelperProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasstop.LogiBattery
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: LogiBattery
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Para mostrar a bateria do fone Bluetooth junto com os outros aparelhos."
        CODE_SIGN_ENTITLEMENTS: LogiBattery/LogiBattery.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LogiBatteryWidget
        embed: true
      - target: LogiBatteryPowerHelper
        embed: false
      - package: QCYKit
    postBuildScripts:
      - name: Embed Power Helper
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          helper_dst="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/HelperTools"
          plist_dst="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchDaemons"
          mkdir -p "$helper_dst" "$plist_dst"
          cp "$BUILT_PRODUCTS_DIR/LogiBatteryPowerHelper" "$helper_dst/LogiBatteryPowerHelper"
          cp "$SRCROOT/LogiBatteryPowerHelper/com.lucasstop.LogiBattery.power-helper.plist" "$plist_dst/"
          if [ "${CODE_SIGNING_ALLOWED:-NO}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --options runtime --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$helper_dst/LogiBatteryPowerHelper"
          fi
  LogiBatteryPowerHelper:
    type: tool
    platform: macOS
    sources:
      - LogiBatteryPowerHelper/main.swift
      - LogiBatteryPowerHelper/PowerHelperProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasstop.LogiBattery.power-helper
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  LogiBatteryWidget:
    type: app-extension
    platform: macOS
    sources:
      - LogiBatteryWidget
      - LogiBattery/Localizable.xcstrings
      - LogiBattery/Core/Domain/Device.swift
      - LogiBattery/Core/Storage/Snapshot.swift
      - LogiBattery/Core/Storage/WidgetPageStore.swift
      - LogiBattery/Core/Storage/HistoryStore.swift
      - LogiBattery/UI/Components/HistoryChart.swift
      - LogiBattery/UI/Components/BatteryCell.swift
      - LogiBattery/UI/Components/DeviceSideItem.swift
      - LogiBattery/Symbols.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasstop.LogiBattery.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LogiBattery
        CODE_SIGN_ENTITLEMENTS: LogiBatteryWidget/LogiBatteryWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: LogiBatteryWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LogiBatteryTests:
    type: bundle.unit-test
    platform: macOS
    sources: [LogiBatteryTests, Tests/Fixtures]
    dependencies:
      - target: LogiBattery
      - package: QCYKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasstop.LogiBatteryTests
        GENERATE_INFOPLIST_FILE: YES
  LogiBatteryUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [LogiBatteryUITests]
    dependencies:
      - target: LogiBattery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucasstop.LogiBatteryUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LogiBattery:
    build:
      targets: {LogiBattery: all, LogiBatteryWidget: all}
    test:
      targets: [LogiBatteryTests]
  LogiBatteryUITests:
    build:
      targets: {LogiBattery: all, LogiBatteryUITests: all}
    test:
      targets: [LogiBatteryUITests]
