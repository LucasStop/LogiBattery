name: CI

on:
  pull_request:
  push:
    branches: [main, dev, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: SwiftLint · Testes
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: brew install xcodegen swiftlint

      - name: Gerar projeto
        if: hashFiles('project.yml') != ''
        run: xcodegen generate

      - name: SwiftLint
        if: hashFiles('project.yml') != ''
        run: swiftlint --strict

      - name: Testes
        if: hashFiles('project.yml') != ''
        # Passos de build só rodam depois que o project.yml existir (issue de fundação).
        # Sem certificado no CI: o App Group exige assinatura, então só os testes rodam sem assinar.
        run: xcodebuild test -scheme "$SCHEME" -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
        env:
          SCHEME: LogiBattery
