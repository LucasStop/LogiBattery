# Guarda local antes do commit. Depois de clonar: lefthook install
# Pular uma vez: LEFTHOOK=0 git commit
pre-commit:
  parallel: true
  commands:
    segredo:
      run: gitleaks git --staged --redact --no-banner
    swiftlint:
      glob: "*.swift"
      exclude: ["tools/**"] # spikes descartáveis ficam fora do lint
      run: swiftlint --strict --force-exclude {staged_files}
