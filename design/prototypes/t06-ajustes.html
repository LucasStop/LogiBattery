<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T06 · Ajustes</title><link rel="stylesheet" href="proto.css"></head><body>
<h1>T06 · Ajustes</h1><p class="lead">Limites, intervalo, login e apagar histórico. Sem botão salvar. US-07, US-08, US-10, US-11. Aparelhos de exemplo (nomes e valores fictícios; modelos reais saem do primeiro run).</p>
<section class="state"><h2>Padrão</h2><div class="pair"><div class="window"><div class="tb">Ajustes</div><div class="bd">
<div class="group"><div class="row"><label>Aviso de bateria baixa<small>Notifica uma vez até recarregar</small></label><div class="stepper"><button class="btn" aria-label="Diminuir">−</button><span class="tabular" style="min-width:48px;text-align:center">20%</span><button class="btn" aria-label="Aumentar">+</button></div></div><div class="row"><label>Aviso de bateria crítica<small></small></label><div class="stepper"><button class="btn" aria-label="Diminuir">−</button><span class="tabular" style="min-width:48px;text-align:center">10%</span><button class="btn" aria-label="Aumentar">+</button></div></div><div class="row"><label>Aviso de carga completa<small>Uma vez por ciclo de carga</small></label><input type="checkbox" class="sw" role="switch" checked></div></div>
<div class="group"><div class="row"><label>Intervalo de leitura<small>Vale na próxima leitura</small></label><div class="stepper"><button class="btn" aria-label="Diminuir">−</button><span class="tabular" style="min-width:48px;text-align:center">5 min</span><button class="btn" aria-label="Aumentar">+</button></div></div><div class="row"><label>Abrir no login<small></small></label><input type="checkbox" class="sw" role="switch" checked></div></div>
<div class="group"><div class="row"><label>Histórico<small>Mantido por 30 dias</small></label><button class='btn'>Apagar histórico…</button></div></div></div></div></div></section>
<script src="proto.js"></script></body></html>
